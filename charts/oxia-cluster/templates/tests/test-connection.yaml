apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-connection
  # Not the server labels: those would put this pod behind the Services and
  # count it in the PodDisruptionBudget
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: oxia-health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command: ["oxia", "health", "--port={{ include "oxia-cluster.port" .Values.server.config.server.public.bindAddress }}", "--host={{ .Release.Name }}"]
