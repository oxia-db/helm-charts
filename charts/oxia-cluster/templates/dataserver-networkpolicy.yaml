{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "oxia-cluster.server.labels" . | nindent 4 }}
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      {{- include "oxia-cluster.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Client API
    - ports:
        - port: {{ include "oxia-cluster.port" .Values.server.config.server.public.bindAddress | int }}
      {{- with .Values.networkPolicy.public.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Data server and coordinator metrics
    - ports:
        - port: {{ include "oxia-cluster.port" .Values.server.config.observability.metric.bindAddress | int }}
        - port: {{ include "oxia-cluster.port" .Values.coordinator.config.observability.metric.bindAddress | int }}
      {{- with .Values.networkPolicy.metrics.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Data server internal (coordination and replication), coordinator
    # internal and coordinator admin: only the cluster's own pods
    - ports:
        - port: {{ include "oxia-cluster.port" .Values.server.config.server.internal.bindAddress | int }}
        - port: {{ include "oxia-cluster.port" .Values.coordinator.config.server.internal.bindAddress | int }}
        - port: {{ include "oxia-cluster.port" .Values.coordinator.config.server.admin.bindAddress | int }}
      from:
        - podSelector:
            matchLabels:
              {{- include "oxia-cluster.server.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.internal.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
