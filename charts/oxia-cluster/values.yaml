# Default values for oxia-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

initialShardCount: 3
replicationFactor: 3
allowExtraAuthorities: []
# Additional authorities advertised to clients in shard assignments.
# The chart always includes the public bootstrap service authority by default.
# Use this list to append external DNS names or load balancers in addition to it.
# Example:
# allowExtraAuthorities:
#   - oxia.example.com:443

# For multiple namespaces, use:
# namespaces:
#   - name: default
#     initialShardCount: 3
#     replicationFactor: 3
#   - name: my-namespace
#     initialShardCount: 1
#     replicationFactor: 3

coordinator:
  cpu: 100m
  memory: 128Mi
  config:
    server:
      admin:
        bindAddress: "0.0.0.0:6651"
      internal:
        bindAddress: "0.0.0.0:6650"
    observability:
      metric:
        enabled: true
        bindAddress: "0.0.0.0:8081"
      log:
        level: "info"

server:
  replicas: 3
  cpu: 1
  memory: 1Gi
  storage: 8Gi
  #storageClassName: xxx
  # Optionally give the WAL its own dedicated volume, mounted at the configured
  # storage.wal.dir, so WAL fsyncs don't compete with database I/O for the same
  # disk (and the WAL can use a different, e.g. faster, storage class).
  # When unset, wal and database share the single "data" volume as before.
  # wal:
  #   storage: 8Gi
  #   #storageClassName: xxx   # defaults to server.storageClassName
  config:
    server:
      public:
        bindAddress: "0.0.0.0:6648"
      internal:
        bindAddress: "0.0.0.0:6649"
    # For TLS, see the top-level "tls" section.
    storage:
      wal:
        dir: "/data/wal"
        sync: true
        retention: "1h"
      database:
        dir: "/data/db"
        readCacheSizeMB: 512
      notification:
        retention: "1h"
    observability:
      metric:
        enabled: true
        bindAddress: "0.0.0.0:8080"
      log:
        level: "info"

# TLS for the data server endpoints. The certificates come from an existing
# Secret, mounted read-only at /etc/oxia/tls in the server and coordinator
# containers when secretName is set. The Secret holds tls.crt and tls.key, plus
# ca.crt (the CA that signs the cluster's certificates) when internal TLS or
# clientAuth is enabled. cert-manager Certificates write all three.
# The certificate must be valid for the names that get dialed:
#   public:   <release>.<namespace>.svc.cluster.local (bootstrap) and
#             *.<release>-svc.<namespace>.svc.cluster.local (shard leaders)
#   internal: *.<release>-svc
# These settings are merged into the Oxia config. Other TLS options
# (minVersion, cipherSuites, ...) can still be set under
# server.config.server.{public,internal}.tls, server.config.replication.tls and
# coordinator.config.controller.tls.
# "oxia health" only speaks plaintext: with TLS on both endpoints the data
# server probes fall back to TCP checks, and with public TLS "helm test" has
# no test to run.
tls:
  secretName: ""
  # Client endpoint (server.public, port 6648)
  public:
    enabled: false
    # Require clients to present a certificate signed by ca.crt (mTLS)
    clientAuth: false
  # Data server internal endpoint (server.internal, port 6649). Enabling it
  # also enables TLS on the connections to it: replication between data
  # servers (replication.tls) and the coordinator (controller.tls). Both
  # present tls.crt as their client certificate.
  internal:
    enabled: false
    # Require a client certificate signed by ca.crt (mTLS), so that only
    # holders of a cluster certificate can call the internal RPCs
    clientAuth: false

# NetworkPolicy for the data server pods, which also run the coordinator.
# It needs a CNI plugin that enforces NetworkPolicy (e.g. Calico or Cilium).
# Other CNI plugins accept the policy but do not enforce it.
# NetworkPolicies are additive: if other policies already select these pods,
# this one adds its allowed sources to theirs.
# Each "from" is a list of NetworkPolicyPeer entries (podSelector,
# namespaceSelector, ipBlock).
networkPolicy:
  enabled: true
  # Client endpoint (6648). Empty: allowed from anywhere, since clients
  # usually run in other namespaces.
  public:
    from: []
  # Data server and coordinator metrics (8080, 8081). Empty: allowed from
  # anywhere, so Prometheus can scrape them. To allow only Prometheus:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  metrics:
    from: []
  # Data server internal (6649), coordinator internal (6650) and coordinator
  # admin (6651). Always allowed from this release's own pods. Add other
  # sources here, e.g. for admin tooling.
  internal:
    from: []

image:
  repository: oxia/oxia
  tag: latest
  pullPolicy: Always
  #pullSecrets: xxx

pprofEnabled: false
monitoringEnabled: false

# Pod scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# Additional pod annotations
podAnnotations: {}

## Additional environment variables
# serverEnv:
#   - name: MY_VAR
#     value: "my-value"
serverEnv: []
# coordinatorEnv:
#   - name: MY_VAR
#     value: "my-value"
coordinatorEnv: []
